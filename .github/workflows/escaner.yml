name: Escaner semanal

on:
  schedule:
    # Viernes 22:40 UTC = 4:40 p.m. hora de CDMX (despues del cierre de BMV y Wall Street)
    - cron: "40 22 * * 5"
  workflow_dispatch: {}   # permite correrlo a mano desde la pestana Actions

permissions:
  contents: write
  issues: write

jobs:
  escanear:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar librerias
        run: pip install -r requirements.txt
      - name: Validar estrategias (11 anios, dentro y fuera de muestra)
        run: python validar.py
      - name: Escanear senales de la semana
        run: python escanear.py
      - name: Guardar portafolio simulado en el repositorio
        run: |
          git config user.name "escaner-bot"
          git config user.email "escaner-bot@users.noreply.github.com"
          git add seguimiento/
          git diff --cached --quiet || git commit -m "Seguimiento semanal $(date +%Y-%m-%d)"
          git push
      - name: Guardar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-${{ github.run_number }}
          path: resultados/
          retention-days: 90
      - name: Enviar aviso por correo (issue de GitHub)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            cat resultados/reporte_semanal.md
            echo ""
            echo "Detalle y graficas: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo "@${{ github.repository_owner }}"
          } > cuerpo.md
          gh issue create --title "$(cat resultados/titulo.txt)" --body-file cuerpo.md
      - name: Avisar si fallo
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --title "El escaner semanal fallo" \
            --body "Revisa el log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} @${{ github.repository_owner }}"
